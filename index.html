<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Tapper - Premium</title>
    <meta name="description" content="Monster Tapper Pro — A premium idle clicker game. Tap, upgrade, and ascend to destroy endless monsters." />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- Ambient Background Effects -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Flash Overlay for Crits -->
    <div id="flashOverlay"></div>

    <!-- ===== TOP-LEFT: Game Info Panel ===== -->
    <div class="info-panel">
      <div class="game-brand">
        MONSTER <span class="text-glow">TAPPER</span>
        <span class="brand-pro">PRO</span>
      </div>

      <div class="stats-row">
        <div class="stat-block">
          <div class="stat-label">Essence</div>
          <div class="stat-value" id="scoreDisplay">0</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-block">
          <div class="stat-label">Auto DPS</div>
          <div class="stat-value accent" id="tpsDisplay">0</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-block">
          <div class="stat-label">Stage</div>
          <div class="stat-value" id="stageNumber">1</div>
        </div>
      </div>

      <div class="combo-display" id="comboDisplay">COMBO x1.0 🔥</div>

      <!-- Prestige Section -->
      <div id="prestigeSection" class="prestige-panel" style="display:none;">
        <span class="prestige-label">⚡ LEGACY READY</span>
        <button id="prestigeBtn" class="prestige-btn-small">Ascend Now</button>
      </div>
    </div>

    <!-- ===== Floating Stage Name (above monster, updated by JS) ===== -->
    <div id="stageName" class="floating-stage-name">STAGE 1</div>

    <!-- ===== Floating HP Bar (follows monster, updated by JS) ===== -->
    <div id="floatingHP" class="floating-hp">
      <div id="bossTimer" class="boss-timer" style="display:none;">⏱️ 30.0s</div>
      <div class="hp-track">
        <div id="hpBar" class="hp-fill"></div>
      </div>
      <div id="hpText" class="hp-text">50 / 50 HP</div>
    </div>

    <!-- Monster Core -->
    <button class="ai-core" id="aiCore"></button>

    <!-- ===== RIGHT PANEL: Upgrades ===== -->
    <div class="upgrades-panel">
      <div class="upgrades-header">
        <h2 class="section-title">⚔️ Barracks &amp; Arsenal</h2>
        <div class="ascension-badge" id="ascensionBadge" style="display:none;"></div>
      </div>
      <div class="upgrades-list" id="upgradesList">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- ===== BOTTOM CENTER: Active Skills ===== -->
    <div class="skills-container" id="skillsContainer"></div>

    <!-- Reset Button -->
    <button id="resetBtn" class="reset-btn">Reset Data</button>

    <!-- Offline Modal -->
    <div class="offline-modal" id="offlineModal">
      <div class="offline-content">
        <h2>WELCOME BACK! 🚀</h2>
        <p>Your hunters continued the raid while you were away...</p>
        <div class="offline-earnings" id="offlineEarnings">+0 Essence</div>
        <button class="claim-btn" id="claimBtn">Collect Essence</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
